# Example targets file for `sv2-compliance --config targets.toml`
#
# Each [[site]] is one deployment. Only the addresses you provide are tested:
#   pool_address -> SetupConnection with MiningProtocol       (AppType::Pool)
#   jds_address  -> SetupConnection with JobDeclarationProtocol + DECLARE_TX_DATA
#
# `scenarios` (optional) is a per-site allowlist. When present, only scenarios
# whose names partially match an entry run against this site. Omit it to run
# every registered scenario.

[[site]]
name = "SRI Pool (full suite)"
pool_address = "51.161.49.55:34255"
jds_address = "51.161.49.55:34256"

[[site]]
name = "SRI Pool (setup only)"
pool_address = "51.161.49.55:34255"
scenarios = ["setup"]

[[site]]
name = "Backup JDS"
jds_address = "10.0.0.5:34256"
